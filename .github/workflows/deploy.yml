# .github/workflows/deploy.yml
name: autodeployment with git-action

on:
  push:
    branches:
      - main
      - dev  # main과 dev 브랜치에 push 될 때마다 실행

jobs:
  build-job:
    runs-on: ubuntu-latest

    steps:
      - name: GitHub Repository 소스 가져오기
        uses: actions/checkout@v4

      - name: JDK 17 설치
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: application.yml 시크릿 추가
        # Secrets에 저장된 APPLICATION_YML 내용을 파일로 생성
        run: |
          mkdir -p src/main/resources || true
          echo "${{ secrets.APPLICATION_YML }}" > ./src/main/resources/application.yml

      - name: Gradle 빌드
        run: |
          chmod +x ./gradlew
          ./gradlew clean build -x test

      - name: 빌드된 jar 파일 이름 변경 및 이동
        # Spring Boot 빌드 파일(SNAPSHOT.jar)을 app.jar로 이름을 변경하고 준비
        run: |
          mv ./build/libs/*SNAPSHOT.jar ./app.jar
          ls -al

      - name: app.jar를 EC2로 전송 (SCP)
        # appleboy/scp-action을 사용하여 EC2의 tobe 디렉토리로 파일 전송
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          source: ./app.jar
          target: /home/${{ secrets.EC2_USER }}/prod/tobe # EC2 사용자명에 맞게 경로 수정

  deploy-job:
    needs: build-job
    runs-on: ubuntu-latest

    steps:
      - name: EC2에 SSH 접속하여 환경 설정 및 앱 실행 (SSH)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          script_stop: true
          script: |
            # ================================================
            # 🛠️ 환경 자동 설치 (최초 1회 실행 후, 불필요 시 주석 처리 권장)
            echo "🔧 환경 설정 및 필수 소프트웨어 설치 시작"
            sudo apt update -y
            sudo apt install openjdk-17-jdk git nginx -y
            mkdir -p /home/${{ secrets.EC2_USER }}/prod/tobe || true
            mkdir -p /home/${{ secrets.EC2_USER }}/prod/cur || true
            echo "🔧 환경 설정 완료"
            # ================================================
            
            echo "🔁 기존 앱 종료 (8080 포트 사용 중인 프로세스 강제 종료)"
            sudo fuser -k -n tcp 8080 || true

            echo "🧹 이전 배포 삭제 및 이동 (tobe -> cur)"
            # cur 폴더를 비우고, tobe에 있는 새로운 jar 파일을 cur로 이동
            rm -rf /home/${{ secrets.EC2_USER }}/prod/cur/*
            mv /home/${{ secrets.EC2_USER }}/prod/tobe/app.jar /home/${{ secrets.EC2_USER }}/prod/cur/

            echo "🚀 새 앱 실행 (nohup을 이용한 백그라운드 실행)"
            cd /home/${{ secrets.EC2_USER }}/prod/cur
            # nohup을 사용하여 백그라운드에서 실행하고 로그를 output.log에 기록
            sudo nohup java -jar app.jar > output.log 2>&1 &
            
            echo "Deployment successful!"